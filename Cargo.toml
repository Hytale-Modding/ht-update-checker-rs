[package]
name = "ht-update-checker"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = { git = "https://github.com/allan2/dotenvy", version = "0.15.7", features = ["macros"] }
env_logger = "0.11.8"
extension-traits = "2.0.1"
log = { version = "0.4.28", features = ["serde"] }
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "charset", "json", "gzip", "brotli", "zstd", "deflate", "rustls-tls-native-roots"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_path_to_error = "0.1.20"
tokio = { version = "1.48.0", features = ["full"] }
tokio-cron-scheduler = { version = "0.15.1", features = ["english", "signal"] }
serde_json = "1.0.145"
bytes = { version = "1.11.0", features = ["serde"] }
oauth2 = { version = "5.0.0", features = ["timing-resistant-secret-traits"] }
rand = "0.9.2"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
twilight-model = "0.17.0"
twilight-util = { version = "0.17.0", features = ["builder", "link"] }
twilight-http = { version = "0.17.0", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
diesel = { version = "2.3.4", features = ["sqlite", "chrono", "without-deprecated", "serde_json", "uuid", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2.3.0", features = ["sqlite"] }
libsqlite3-sys = { version = "0.35.0", features = ["bundled"] }
r2d2 = "0.8.10"
base64 = "0.22.1"
webbrowser = { version = "1.0.6", features = ["hardened", "disable-wsl"] }
strum = { version = "0.27.2", features = ["derive"] }
serde_with = "3.24.0"
